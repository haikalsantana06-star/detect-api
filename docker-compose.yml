services:
  mysql:
    image: mysql:8
    container_name: cape-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-upitas_mon}
      MYSQL_USER: ${DB_USER:-capeuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-capepass}
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cape-network

  cape-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cape-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DB__HOST: mysql
      DB__PORT: 3306
      DB__NAME: ${DB_NAME:-upitas_mon}
      DB__USER: ${DB_USER:-capeuser}
      DB__PASSWORD: ${DB_PASSWORD:-capepass}
      DEVICE: cpu
      MODEL_DIR: models
      ZONES_PATH: zones.json
      THRESHOLD: "0.5"
    volumes:
      - ./backend/models:/app/models:ro
      - ./backend/zones.json:/app/zones.json:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cape-network
    command: ["bash", "start.sh"]

networks:
  cape-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
