name: CI

on:
  push:
    branches: [main, newest]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ruff

      - name: Run ruff
        run: ruff check backend/ --ignore=E501,F401,DTZ005,PLW0602,B008,SIM102,PLR0402
